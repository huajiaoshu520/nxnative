name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'dm/local_one_click/sync_upstream.py'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'huajiaoshu520/nxnative'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Merge upstream and retain local one-click files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/seedds/nxnative.git main:refs/remotes/upstream/main
          python3 dm/local_one_click/sync_upstream.py
          git push origin HEAD:main
          {
            echo '### Upstream sync'
            echo 'Merged seedds/nxnative main; preserved the local one-click launcher, its helpers, guide and sync workflow.'
            echo 'Official build, game profiles and rendering tools continue to follow upstream.'
            echo 'Conflicts outside protected paths stop the run. No force push.'
          } >> "$GITHUB_STEP_SUMMARY"
