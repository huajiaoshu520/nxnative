name: Local one-click frontend tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test profile discovery, packaging checks and protected merges
        run: |
          python3 -m unittest discover -s dm/local_one_click/tests -v
          bash -n 一键生成完整IPA.command
          bash -n 一键生成Mac应用.command
