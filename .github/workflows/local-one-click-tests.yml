name: Local one-click frontend tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test XCI ticket isolation without game files
        run: |
          dotnet build dm/local_one_click/xci_catalog -c Release -o "$RUNNER_TEMP/xci-catalog" --nologo
          dotnet "$RUNNER_TEMP/xci-catalog/xci_catalog.dll" --self-test
      - name: Test profile discovery, packaging checks and protected merges
        run: |
          python3 -m unittest discover -s dm/local_one_click/tests -v
          bash -n 一键生成完整IPA.command
          bash -n 一键生成Mac应用.command
